<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
  <title>Focus Flight AMap 3D</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #040914;
      overflow: hidden;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #040914;
    }
    /* 高德 Marker 标点 */
    .amap-marker-custom {
      position: relative;
      width: 24px;
      height: 24px;
    }
    .marker-inner-origin {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0ea5e9;
      box-shadow: 0 0 18px #0ea5e9;
      border: 2px solid #ffffff;
    }
    .marker-inner-dest {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 18px #10b981;
      border: 2px solid #ffffff;
    }
    .marker-pulse {
      position: absolute;
      top: -9px;
      left: -9px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      animation: pulse 2s infinite ease-out;
      pointer-events: none;
    }
    .marker-inner-origin + .marker-pulse {
      border: 2px solid #0ea5e9;
    }
    .marker-inner-dest + .marker-pulse {
      border: 2px solid #10b981;
    }
    @keyframes pulse {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .city-tag {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #f8fafc;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    /* 悬浮 3D 左右旋转与视角控制面板 */
    .rotation-controls {
      position: absolute;
      bottom: 80px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ctrl-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      active-scale: 0.92;
    }
  </style>
  <!-- 高德地图 HarmonyOS 专属 Key -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: '04f057865e90d81b9e28d0b5e7d50bc0',
    }
  </script>
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=6058c5f8287835ee31c953e15295ace5"></script>
</head>
<body>
  <div id="container"></div>

  <!-- 3D 视角与左右旋转控制组件 -->
  <div class="rotation-controls">
    <div class="ctrl-btn" id="rotate-left" title="向左旋转">⟲</div>
    <div class="ctrl-btn" id="rotate-right" title="向右旋转">⟳</div>
    <div class="ctrl-btn" id="toggle-pitch" title="切换俯仰视角">📐</div>
    <div class="ctrl-btn" id="reset-north" title="重置正北">🧭</div>
  </div>

  <script>
    let map = null;
    let currentRotation = 0;
    let currentPitch = 35;

    // 初始化高德地图 3D 模式
    function initAMap3D() {
      if (typeof AMap === 'undefined') {
        setTimeout(initAMap3D, 150);
        return;
      }
      map = new AMap.Map('container', {
        zoom: 4.8,
        center: [108.947, 34.259],
        mapStyle: 'amap://styles/darkblue', // 高德暗夜科技风
        viewMode: '3D',                      // 启用 3D 模式
        pitch: currentPitch,                 // 倾斜视角
        rotation: currentRotation,           // 旋转视角
        rotateEnable: true,                  // 开启手势旋转
        pitchEnable: true,                   // 开启手势倾斜
        dragEnable: true,
        zoomEnable: true,
        touchZoom: true
      });

      // 视界大小调整
      window.addEventListener('resize', () => {
        if (map) map.resize();
      });

      // 绑定旋转与视角控制按键
      document.getElementById('rotate-left').addEventListener('click', function() {
        if (map) {
          currentRotation = (currentRotation - 30 + 360) % 360;
          map.setRotation(currentRotation, false, 400);
        }
      });

      document.getElementById('rotate-right').addEventListener('click', function() {
        if (map) {
          currentRotation = (currentRotation + 30) % 360;
          map.setRotation(currentRotation, false, 400);
        }
      });

      document.getElementById('toggle-pitch').addEventListener('click', function() {
        if (map) {
          currentPitch = currentPitch === 35 ? 60 : 35;
          map.setPitch(currentPitch, false, 400);
        }
      });

      document.getElementById('reset-north').addEventListener('click', function() {
        if (map) {
          currentRotation = 0;
          currentPitch = 35;
          map.setRotation(0, false, 500);
          map.setPitch(35, false, 500);
        }
      });
    }

    initAMap3D();

    // 在高德 3D 地图中绘制起止 Marker 与发光弧迹
    function setAMapFlightRoute(oLat, oLon, oCity, oCode, dLat, dLon, dCity, dCode) {
      if (!map || typeof AMap === 'undefined') {
        setTimeout(() => setAMapFlightRoute(oLat, oLon, oCity, oCode, dLat, dLon, dCity, dCode), 300);
        return;
      }

      map.clearMap();

      const originCoord = [parseFloat(oLon), parseFloat(oLat)];
      const destCoord = [parseFloat(dLon), parseFloat(dLat)];

      // 1. 起点 Marker
      const originContent = `
        <div class="amap-marker-custom">
          <div class="marker-inner-origin"></div>
          <div class="marker-pulse"></div>
          <div class="city-tag">🛫 ${oCity} (${oCode})</div>
        </div>
      `;
      const originMarker = new AMap.Marker({
        position: originCoord,
        content: originContent,
        offset: new AMap.Pixel(-12, -12)
      });
      map.add(originMarker);

      // 2. 终点 Marker
      const destContent = `
        <div class="amap-marker-custom">
          <div class="marker-inner-dest"></div>
          <div class="marker-pulse"></div>
          <div class="city-tag">🛬 ${dCity} (${dCode})</div>
        </div>
      `;
      const destMarker = new AMap.Marker({
        position: destCoord,
        content: destContent,
        offset: new AMap.Pixel(-12, -12)
      });
      map.add(destMarker);

      // 3. 计算 3D 弧线
      const numPoints = 80;
      const path = [];
      for (let i = 0; i <= numPoints; i++) {
        const t = i / numPoints;
        const lng = originCoord[0] + (destCoord[0] - originCoord[0]) * t;
        const lat = originCoord[1] + (destCoord[1] - originCoord[1]) * t + Math.sin(t * Math.PI) * 3.8;
        path.push([lng, lat]);
      }

      // 高德底层线
      const polylineGlow = new AMap.Polyline({
        path: path,
        isOutline: false,
        strokeColor: '#0ea5e9',
        strokeOpacity: 0.45,
        strokeWeight: 10,
        lineJoin: 'round',
        lineCap: 'round'
      });
      map.add(polylineGlow);

      // 高德核心线
      const polylineCore = new AMap.Polyline({
        path: path,
        isOutline: false,
        strokeColor: '#38bdf8',
        strokeOpacity: 0.95,
        strokeWeight: 4.5,
        lineJoin: 'round',
        lineCap: 'round'
      });
      map.add(polylineCore);

      // 4. 视角对焦
      map.setFitView([originMarker, destMarker], false, [90, 90, 90, 90]);
      setTimeout(() => {
        if (map) map.resize();
      }, 500);
    }

    // 暴露供 ArkTS 调用的接口
    window.setFlightRoute = function(oLat, oLon, oCity, oCode, dLat, dLon, dCity, dCode) {
      setAMapFlightRoute(oLat, oLon, oCity, oCode, dLat, dLon, dCity, dCode);
    };
  </script>
</body>
</html>
